<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking - WANA Car Rental</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        form {
            background-color: #333;
            padding: 30px;
            border-radius: 10px;
            display: inline-block;
            text-align: left;
            max-width: 400px;
            width: 100%;
        }
        input, select, button {
            display: block;
            width: 100%;
            margin-bottom: 15px;
            padding: 10px;
            font-size: 1em;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #D4AF37;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #C89F31;
        }
        .total {
            font-size: 1.2em;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
    <script>
        // Fungsi untuk mendapatkan parameter dari URL
        function getCarFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('car');
        }

        // Fungsi untuk memaparkan maklumat kereta yang dipilih dan harga
        function displayCarInfo() {
            const car = getCarFromUrl();
            const carPrices = {
                Bezza: 150,
                Azia: 160,
                Myvi: 170,
                Alza: 180,
                Saga: 190
            };

            if (car && carPrices[car]) {
                document.getElementById("car-name").innerText = car;
                document.getElementById("total-price").textContent = `Price per day: RM ${carPrices[car]}`;
                document.getElementById("car-price").value = carPrices[car];  // Store the price for calculation
            } else {
                document.getElementById("car-name").innerText = "Invalid car selection.";
                document.getElementById("total-price").textContent = "";
            }
        }

        // Fungsi untuk mengira jumlah berdasarkan tarikh
        function calculateTotal() {
            const carPrice = parseInt(document.getElementById("car-price").value);
            const pickupDate = new Date(document.getElementById("pickup-date").value);
            const dropoffDate = new Date(document.getElementById("dropoff-date").value);

            if (pickupDate && dropoffDate && carPrice) {
                const timeDiff = dropoffDate - pickupDate;
                const days = Math.ceil(timeDiff / (1000 * 60 * 60 * 24));

                if (days > 0) {
                    const total = days * carPrice;
                    document.getElementById("total-price").textContent = `Total Price: RM ${total}`;
                } else {
                    document.getElementById("total-price").textContent = "Invalid dates. Please select valid pick-up and drop-off dates.";
                }
            } else {
                document.getElementById("total-price").textContent = "";
            }
        }

        window.onload = displayCarInfo;
    </script>
</head>
<body>
    <h1>Complete Your Booking</h1>
    <form action="confirmation.html" method="GET" oninput="calculateTotal()">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required>
        
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
        
        <label for="pickup-date">Pick-up Date</label>
        <input type="date" id="pickup-date" name="pickup_date" required>
        
        <label for="dropoff-date">Drop-off Date</label>
        <input type="date" id="dropoff-date" name="dropoff_date" required>
        
        <label for="car-type">Car Type (Selected: <span id="car-name"></span>)</label>
        <input type="text" id="car-type" value="Standard Car" disabled>
        <input type="hidden" id="car-price" value="0">
        
        <div class="total" id="total-price">Total Price: RM 0</div>
        
        <button type="submit">Confirm Booking</button>
    </form>
</body>
</html>
