<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - WANA Car Rental</title>
    <style>
        /* General Styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #000; 
            color: #fff; 
        }

        header {
            background-color: #000;
            padding: 20px 0;
            border-bottom: 4px solid #D4AF37;
            text-align: center;
        }

        header .text {
            font-size: 2em;
            font-weight: bold;
            color: #D4AF37;
        }

        /* Form and Success Message Container */
        .form-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #111;
        }

        .form-section {
            background-color: #333;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 100%;
            display: block; /* By default, it's visible */
            text-align: center;
        }

        .success-message-section {
            background-color: #333;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 100%;
            display: none; 
            text-align: center;
        }

        .signup-form h2, .success-message h2 {
            text-align: center;
            color: #D4AF37;
            margin-bottom: 20px;
        }

        .form-input {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #555;
            border-radius: 5px;
            background-color: #222;
            color: #fff;
            font-size: 1em;
        }

        .form-input:focus {
            outline: none;
            border-color: #D4AF37;
        }

        .signup-btn {
            width: 100%;
            padding: 15px;
            background-color: #D4AF37;
            color: #000;
            border: none;
            border-radius: 5px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .signup-btn:hover {
            background-color: #b8972e;
        }

        /* Back to Home Button */
        .back-home-btn {
            padding: 15px 30px;
            background-color: #D4AF37;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.2em;
            margin-top: 20px;
            display: inline-block;
            transition: background-color 0.3s;
        }

        .back-home-btn:hover {
            background-color: #b8972e;
        }

        .back-home-btn-container {
            display: flex;
            justify-content: center; 
            margin-top: 20px;
        }

        /* Footer */
        footer {
            background-color: #000;
            color: white;
            text-align: center;
            padding: 20px 0;
            border-top: 4px solid #D4AF37;
        }

        footer p {
            margin: 0;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="text">WANA Car Rental</div>
    </header>

    <!-- Form and Success Message Section -->
    <section class="form-container">
        <!-- Form Section -->
        <div class="form-section" id="formSection">
            <form class="signup-form" id="signupForm" onsubmit="return showSuccessMessage(event)">
                <h2>Sign Up</h2>
                <!-- Name Input -->
                <input type="text" name="name" class="form-input" placeholder="Full Name" required>

                <!-- Email Input -->
                <input type="email" name="email" class="form-input" placeholder="Email" required>

                <!-- Password Input -->
                <input type="password" name="password" class="form-input" placeholder="Password" required>

                <!-- Submit Button -->
                <button type="submit" class="signup-btn">Sign Up</button>
            </form>
        </div>

        <!-- Success Message Section -->
        <div class="success-message-section" id="successMessageSection">
            <h2>Sign Up Successful!</h2>
            <p>Your account has been created.</p>
            <div class="back-home-btn-container">
                <button class="back-home-btn" onclick="window.location.href='index.html'">Back to Home</button>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 WANA Car Rental. All rights reserved.</p>
    </footer>

    <script>
        // Function to show the success message after form submission
        function showSuccessMessage(event) {
            event.preventDefault(); // Prevent the form from submitting

            // Hide the sign-up form
            document.getElementById('formSection').style.display = 'none';

            // Show the success message
            document.getElementById('successMessageSection').style.display = 'block';
        }
    </script>
</body>
</html>
